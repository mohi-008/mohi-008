<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="hero-title hero-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="hero-title">Mohit Kumar, AI/ML student</title>
  <desc id="hero-desc">Animated header with a slowly rotating wireframe neural-network sphere, an orbiting data ring, and the text: I don't just code the future. I teach it to think.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06070E"/>
      <stop offset="1" stop-color="#0E0B24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8CCFF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="340" rx="18"/></clipPath>
    <clipPath id="floor"><rect x="470" y="228" width="430" height="112"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="340" fill="url(#bg)"/>

    <!-- perspective floor grid -->
    <g clip-path="url(#floor)" stroke="#22D3EE" stroke-opacity="0.13" stroke-width="1" fill="none">
      <line x1="700" y1="225" x2="260" y2="340"/>
      <line x1="700" y1="225" x2="370" y2="340"/>
      <line x1="700" y1="225" x2="480" y2="340"/>
      <line x1="700" y1="225" x2="590" y2="340"/>
      <line x1="700" y1="225" x2="700" y2="340"/>
      <line x1="700" y1="225" x2="810" y2="340"/>
      <line x1="700" y1="225" x2="920" y2="340"/>
      <line x1="700" y1="225" x2="1030" y2="340"/>
      <line x1="700" y1="225" x2="1140" y2="340"/>
      <line x1="470" y1="236" x2="900" y2="236"/>
      <line x1="470" y1="248" x2="900" y2="248"/>
      <line x1="470" y1="264" x2="900" y2="264"/>
      <line x1="470" y1="286" x2="900" y2="286"/>
      <line x1="470" y1="316" x2="900" y2="316"/>
    </g>

    <!-- ambient glow behind the sphere -->
    <circle cx="700" cy="150" r="170" fill="url(#glow)">
      <animate attributeName="r" values="160;178;160" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- floating particles -->
    <g fill="#A78BFA">
      <circle cx="520" cy="62" r="2" opacity="0.5">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="62;54;62" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="846" cy="84" r="2.5" opacity="0.5">
        <animate attributeName="opacity" values="0.8;0.15;0.8" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="84;94;84" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="858" cy="222" r="2" opacity="0.5">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="548" cy="214" r="1.8" opacity="0.5">
        <animate attributeName="opacity" values="0.7;0.15;0.7" dur="5.5s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="214;206;214" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="590" cy="30" r="1.5" fill="#22D3EE" opacity="0.5">
        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="812" cy="32" r="1.5" fill="#22D3EE" opacity="0.5">
        <animate attributeName="opacity" values="0.7;0.1;0.7" dur="7.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- wireframe sphere -->
    <circle cx="700" cy="150" r="105" fill="#0B0820" fill-opacity="0.55" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="1.2"/>

    <!-- latitude rings -->
    <g fill="none" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1">
      <ellipse cx="700" cy="77"  rx="73.5" ry="16.2"/>
      <ellipse cx="700" cy="113" rx="97.9" ry="21.5"/>
      <ellipse cx="700" cy="150" rx="105"  ry="23.1"/>
      <ellipse cx="700" cy="187" rx="97.9" ry="21.5"/>
      <ellipse cx="700" cy="223" rx="73.5" ry="16.2"/>
    </g>

    <!-- longitude rings: rx breathes between full width and edge-on to fake rotation -->
    <g fill="none" stroke="#22D3EE" stroke-opacity="0.38" stroke-width="1">
      <ellipse cx="700" cy="150" rx="105" ry="105">
        <animate attributeName="rx" values="105;74;0;74;105" keyTimes="0;0.25;0.5;0.75;1" dur="18s" begin="0s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="700" cy="150" rx="105" ry="105">
        <animate attributeName="rx" values="105;74;0;74;105" keyTimes="0;0.25;0.5;0.75;1" dur="18s" begin="-3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="700" cy="150" rx="105" ry="105">
        <animate attributeName="rx" values="105;74;0;74;105" keyTimes="0;0.25;0.5;0.75;1" dur="18s" begin="-6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="700" cy="150" rx="105" ry="105">
        <animate attributeName="rx" values="105;74;0;74;105" keyTimes="0;0.25;0.5;0.75;1" dur="18s" begin="-9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="700" cy="150" rx="105" ry="105">
        <animate attributeName="rx" values="105;74;0;74;105" keyTimes="0;0.25;0.5;0.75;1" dur="18s" begin="-12s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="700" cy="150" rx="105" ry="105">
        <animate attributeName="rx" values="105;74;0;74;105" keyTimes="0;0.25;0.5;0.75;1" dur="18s" begin="-15s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- neural core: nodes joined by edges with flowing data -->
    <g stroke="#67E8F9" stroke-opacity="0.75" stroke-width="1.2" stroke-dasharray="3 6" fill="none">
      <line x1="655" y1="100" x2="715" y2="75"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1.8s" repeatCount="indefinite"/></line>
      <line x1="715" y1="75" x2="745" y2="115"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1.8s" repeatCount="indefinite"/></line>
      <line x1="745" y1="115" x2="760" y2="170"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1.8s" repeatCount="indefinite"/></line>
      <line x1="760" y1="170" x2="690" y2="200"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1.8s" repeatCount="indefinite"/></line>
      <line x1="690" y1="200" x2="640" y2="170"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1.8s" repeatCount="indefinite"/></line>
      <line x1="640" y1="170" x2="655" y2="100"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1.8s" repeatCount="indefinite"/></line>
      <line x1="655" y1="100" x2="745" y2="115"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1.8s" repeatCount="indefinite"/></line>
      <line x1="640" y1="170" x2="760" y2="170"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1.8s" repeatCount="indefinite"/></line>
    </g>
    <g fill="#E0F7FF">
      <circle cx="655" cy="100" r="4"><animate attributeName="r" values="3;5;3" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="715" cy="75"  r="4"><animate attributeName="r" values="3;5;3" dur="3s" begin="-0.5s" repeatCount="indefinite"/></circle>
      <circle cx="745" cy="115" r="4"><animate attributeName="r" values="3;5;3" dur="3s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="170" r="4"><animate attributeName="r" values="3;5;3" dur="3s" begin="-1.5s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="200" r="4"><animate attributeName="r" values="3;5;3" dur="3s" begin="-2s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="170" r="4"><animate attributeName="r" values="3;5;3" dur="3s" begin="-2.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- orbiting data ring -->
    <g transform="rotate(-18 700 150)">
      <ellipse cx="700" cy="150" rx="135" ry="30" fill="none" stroke="#22D3EE" stroke-opacity="0.32" stroke-width="1"/>
      <circle r="4.5" fill="#22D3EE">
        <animateMotion dur="9s" repeatCount="indefinite" path="M565,150 a135,30 0 1,0 270,0 a135,30 0 1,0 -270,0"/>
      </circle>
      <circle r="3.5" fill="#C4B5FD">
        <animateMotion dur="9s" begin="-4.5s" repeatCount="indefinite" path="M565,150 a135,30 0 1,0 270,0 a135,30 0 1,0 -270,0"/>
      </circle>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="48" y="124" font-size="64" font-weight="700" letter-spacing="-1" fill="url(#nameFill)">Mohit Kumar
        <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
      </text>

      <text x="50" y="168" font-size="26" font-weight="600" fill="#67E8F9">I don't just code the future.
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.35;1" dur="1.4s" fill="freeze"/>
      </text>
      <text x="50" y="200" font-size="26" font-weight="600" fill="#C4B5FD">I teach it to think.
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="1.9s" fill="freeze"/>
      </text>

      <rect x="50" y="222" width="96" height="3" rx="1.5" fill="url(#rule)">
        <animate attributeName="width" values="0;0;96" keyTimes="0;0.5;1" dur="2.2s" fill="freeze"/>
      </rect>

      <text x="50" y="272" font-size="16" fill="#9AA0BA">B.Tech Computer Science &amp; Engineering (AI-ML)
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;1" dur="2.4s" fill="freeze"/>
      </text>
      <text x="50" y="296" font-size="16" fill="#9AA0BA">Lovely Professional University, class of 2028
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.65;1" dur="2.6s" fill="freeze"/>
      </text>
    </g>
  </g>
</svg>
